<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum Recrutement NEOMA - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>NEOMA • Networking</h2>
    <div class="subtitle">Forum de recrutement - Reims</div>
    
    <label for="prenom">Prénom du contact (facultatif) :</label>
    <input type="text" id="prenom" placeholder="Ex: Camille">

    <label for="entreprise">Entreprise :</label>
    <input type="text" id="entreprise" placeholder="Ex: L'Oréal" required>

    <label for="email">E-mail professionnel :</label>
    <input type="email" id="email" placeholder="Ex: camille.dupont@entreprise.com" required>

    <div class="checkbox-group">
        <input type="checkbox" id="inclureProjet">
        <label for="inclureProjet">Mentionner le projet Finance</label>
    </div>

    <button onclick="preparerMail()">Envoyer mon CV</button>
</div>

<script src="script.js"></script>
</body>
</html>
